services:
  triton:
    image: nvcr.io/nvidia/tritonserver:25.03-py3
    pull_policy: always
    container_name: palm-triton
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: all
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ../model_repository:/models:ro
    command:
      - tritonserver
      - --model-repository=/models

  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    pull_policy: always
    container_name: palm-qdrant
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: all
    environment:
      QDRANT__GPU__INDEXING: "1"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../qdrant_data:/qdrant/storage

  backend:
    image: vkev25811/palm-backend:latest
    pull_policy: always
    container_name: palm-backend
    restart: unless-stopped
    depends_on:
      - triton
      - qdrant
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "7001"
      TRITON_GRPC_URL: "triton:8001"
      TRITON_MODEL_NAME: "feature_extraction"
      TRITON_INPUT_NAME: "INPUT__0"
      TRITON_OUTPUT_NAME: "OUTPUT__0"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      QDRANT_COLLECTION: "palm_vectors"
    ports:
      - "7001:7001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/healthz', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: vkev25811/palm-frontend:latest
    pull_policy: always
    container_name: palm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
